[workspace]
members = ["crates/client", "crates/server", "crates/shared", "crates/bulk_test"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["O'Brian"]
license = "LicenseRef-Proprietary"


[workspace.dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "async_executor",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_image",
    "bevy_input_focus",
    "bevy_mesh",
    "bevy_log",
    "bevy_picking",
    "bevy_render",
    "bevy_shader",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_winit",
    "bevy_dev_tools",
    "std",
    "multi_threaded",
    "default_font",
    "png",
    "jpeg",

    "picking",

    "mouse",
    "keyboard",

    "debug",
] }

anyhow = "1.0"
dotenv = "0.15"

hexx = { version = "0.22", features = ["bevy"] }
i_triangle = "0.38.0"
rand = "0.9.2"
noise = "0.9"

# Images
image = "0.25.8"
imageproc = "0.25.0"
resvg = "0.45.1"
tiny-skia = "0.11"
usvg = "0.45.1"

# Parallelization
rayon = "1.10"

# Database (server) and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "derive",
    "chrono",
] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime (server)
tokio = { version = "1.42", features = ["full"] }

# Networking
futures = "0.3"
bincode = "2.0.1"
lightyear = { version = "0.26", features = [
    "websocket",
    "webtransport",
    "webtransport_dangerous_configuration",  # dev: skip SSL certs
    "netcode",
    "udp"
] }
tracing-appender = "0.2"

chrono = "0.4"

lz4_flex = "0.11"
